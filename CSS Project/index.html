<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="ADITYA">
    <meta name="decripstion" content="The official website for The Little Taco Shop">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/favicon.ico">
    <title>The Little Taco Shop</title>
</head>

<body>
    <header class="header">
        <!-- Title -->
        <h1 class="header__h1">Little Taco Shop</h1>
        <nav class="header__nav">
            <ul class="header__ul">

                <li><a href="#menu">Menu</a></li>

                <li><a href="hour.html" target="_blank">Hours</a></li>

                <li><a href="contact.html" target="_blank">Contact</a></li>

                <li><a href="about.html" target="_blank">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h2 class="hero__h2">Welcome</h2>
        <figure>
            <img src="./img/tacos_and_drink_1000x667.png" alt="This image is shows tacos and drink on table">
            <figcaption class="offscreen">Tacos and a Drink</figcaption>
        </figure>
    </section>
    <main class="main">
        <article id="menu" class="main__article menu">
            <h2 id="menu_heading">Our Menu</h2>
            <table class="menu_container">
                <caption class="offscreen">Our Tacos</caption>
                <thead>
                <tr>
                    <th class="menu_header">Tacos</th>
                    <th class="menu_header">Quantity</th>
                    <th class="menu_header">Price</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td class="menu_item menu_c" rowspan="3">Crunchy</td>
                    <td class="menu_item">1</td>
                    <td class="menu_item">$1.50</td>
                </tr>
                <tr>
                    <td class="menu_item">2</td>
                    <td class="menu_item">$2.50</td>
                </tr>
                <tr>
                    <td class="menu_item">3</td>
                    <td class="menu_item">$3.25</td>
                </tr>
                <tr>
                    <td class="menu_item menu_s" rowspan="3">Soft</td>
                    <td class="menu_item">1</td>
                    <td class="menu_item">$2.00</td>
                </tr>
                <tr>
                    <td class="menu_item">2</td>
                    <td class="menu_item">$3.50</td>
                </tr>
                <tr>
                    <td class="menu_item">3</td>
                    <td class="menu_item">$4.50</td>
                </tr>
                <tr>
                    <td class="menu_item menu_cs" colspan="3">Chips &amp; Salsa $2</td>
                </tr>
                </tbody>
            </table>
            <br><br>
            <p class="center">
            <a  href="#">Back to Top</a>
            </p>
        </article>
    </main>
    <footer class="footer">
        <p>
            <span class="nowrap">Copyright &copy; </span>
            <span class="nowrap">The Little Taco Shop</span>
        </p>
    </footer>

</body>

</html>
