<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/favicon.ico">
    <title>Contact LTS</title>
</head>

<body>
    <header class="header">
        <!-- Title -->
        <h1 class="header__h1">Little Taco Shop</h1>
        <nav class="header__nav">
            <ul class="header__ul">
                <li><a href="index.html" target="_blank">Home</a></li>

                <li><a href="index.html#menu">Menu</a></li>

                <li><a href="hour.html" target="_blank">Hours</a></li>

                <li><a href="about.html" target="_blank">About</a></li>

            </ul>
        </nav>
    </header>

    <section class="hero">
        <figure>
            <img src="./img/tacos_close_up_1000x649.png" alt="This image is shows tacos and drink on table">
            <figcaption class="offscreen">Little Toca Shop Tacos</figcaption>
        </figure>
    </section>

    <main class="main contact">
        <article class="main__article contact_first">
            <h2 class="contact_h2">Our Location</h2>

            <p id="adderess">555 Taco temptation Lane, Suite T <br>Kansas City, MO 55555-5555</p>

            <p>Phone: <a href="tel:+15551234567">555-555-5555</a></p>
        </article>
        <article class="main__article">
            <h2>Our Contact Form</h2>
            <form action="#">
                    <p>
                        <label class="label" for="Name">Name: </label>
                        <input class="input_form" type="text" id="Name" name="Name" placeholder="your name" required>
                    </p>
                    <p>
                        <label class="label" for="Email">Email: </label>
                        <input class="input_form" type="email" name="Email" id="Email" placeholder="your email">
                    </p>
                    <p>
                        <label class="label" for="Message">Your Message:</label><br>
                        <textarea class="input_form" name="Message" id="Message" cols="30" rows="12"
                            placeholder="Type your message here"></textarea>
                    </p>
                <button class="btn_form" type="submit">Send</button>
                <button class="btn_form" type="reset">Reset</button>
            </form>
        </article>
    </main>
    <footer class="footer">
        <p>
            <span class="nowrap">Copyright &copy; </span>
            <span class="nowrap">The Little Taco Shop</span>
        </p>
    </footer>

</body>

</html>
